[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
version = "0.2.0"
description = "Context Anchor: tenant-scoped source-linked memory and evidence-checked answers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.24,<3",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "httpcore>=1.0,<1.1",
    "cryptography>=42,<47",
    "pyjwt[crypto]>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "build>=1,<2",
]
server = [
    "uvicorn[standard]>=0.29,<1",
    "python-dotenv>=1,<2",
]
postgres = [
    "psycopg[binary]>=3.1,<4",
]
st = [
    "sentence-transformers>=2.6,<6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nova*"]
exclude = ["tests*", "benchmark*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "nova.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::ResourceWarning"]
