name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format, hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: No generated files or secrets tracked
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.py[cod]$|\.db(-wal|-shm)?$|\.sqlite3?$|(^|/)\.env$|\.egg-info/|(^|/)build/|^benchmark/(cases|\.cache|results)/|\.coverage$|(^|/)\.(pytest|ruff)_cache/'; then
            echo "Generated or local files are tracked (listed above)." >&2
            exit 1
          fi

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install from documented instructions
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
      - name: Run tests (ResourceWarnings are errors, see pyproject.toml)
        run: pytest -ra

  benchmark-smoke:
    name: Benchmark smoke (fake LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run benchmark (fake LLM, 30 dev cases)
        run: |
          python -m benchmark.runner \
            --seed 7 --n 30 --split dev \
            --systems baseline,rag --llm fake --limit 30
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-results
          path: benchmark/results/
          retention-days: 7

  package:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check wheel contents
        run: python scripts/check_wheel.py dist/*.whl
      - name: Clean runtime-only install and import
        run: |
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install --upgrade pip
          /tmp/clean-venv/bin/pip install dist/*.whl
          /tmp/clean-venv/bin/pip check
          cd "$(mktemp -d)"
          /tmp/clean-venv/bin/python -c "import nova.api.main as m; print(m.app.title)"
          if /tmp/clean-venv/bin/python -c "import pytest" 2>/dev/null; then
            echo "pytest leaked into the runtime install" >&2
            exit 1
          fi
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
